[project]
name = "techval"
version = "0.1.0"
description = "Analyst-grade DCF, trading comps and merger analysis for US-listed technology companies from free filings and market data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ruhan Sahasi" }]
dependencies = [
    "requests>=2.31",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pydantic>=2.6",
    "typer>=0.12",
    "pyyaml>=6.0",
    "rich>=13.7",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jupyter>=1.0", "nbclient>=0.10"]
rag = ["anthropic>=1.6,<2"]

[project.scripts]
techval = "techval.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/techval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
# src layout: put the package and the fixtures helper on the path directly, so
# the suite runs the working tree rather than whatever happens to be installed.
pythonpath = ["src", "tests"]
