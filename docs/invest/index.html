<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo portfolio · techval invest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Newsreader:ital,wght@0,400;0,500;1,400&amp;family=Public+Sans:wght@400;500;650&amp;display=swap">
<style>
/*
 * techval investing dashboard tokens.
 *
 * The same vocabulary as the results dashboard, arranged dark first: the app
 * opens dark, so the complete dark palette lives on bare :root and the light
 * block redefines colours and nothing else. A test asserts that every shared
 * name carries the same value as the results dashboard's tokens, theme for
 * theme, so the two pages are one family without sharing a file.
 */

:root {
  --font-sans: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-serif: "Newsreader", "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --fs-micro: 11px;
  --fs-small: 12.5px;
  --fs-body: 14.5px;
  --fs-lead: 17px;
  --fs-h3: 15px;
  --fs-h2: 30px;
  --fs-h1: 44px;
  --fs-figure: 24px;
  --lh-tight: 1.2;
  --lh-body: 1.55;
  --fw-regular: 400;
  --fw-medium: 500;
  --fw-semibold: 650;
  --tracking-caps: 0.06em;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 72px;
  --radius-control: 6px;
  --radius-card: 14px;
  --radius-chip: 999px;
  --rail-width: 220px;
  --main-max: 1120px;
  --c-model: var(--series-1);
  --c-model-muted: var(--deemph);
  --c-alt: var(--series-2);
  --c-third: var(--series-3);
  --c-baseline: var(--deemph);
  --c-total: var(--ink-2);
  --div-neg-3: var(--div-neg);
  --div-neg-2: color-mix(in oklab, var(--div-neg) 66%, var(--div-mid));
  --div-neg-1: color-mix(in oklab, var(--div-neg) 33%, var(--div-mid));
  --div-0: var(--div-mid);
  --div-pos-1: color-mix(in oklab, var(--div-pos) 33%, var(--div-mid));
  --div-pos-2: color-mix(in oklab, var(--div-pos) 66%, var(--div-mid));
  --div-pos-3: var(--div-pos);
  --teal-100: #deeeed;
  --teal-200: #b9dad9;
  --teal-300: #90c4c3;
  --teal-400: #5fadac;
  --teal-500: #099393;
  --teal-600: #046464;
  --teal-700: #024040;

  color-scheme: dark;
  --page: #0a1216;
  --surface: #101b21;
  --raised: #16232a;
  --ink-1: #e9f1f0;
  --ink-2: #aebdc0;
  --ink-3: #87999f;
  --grid: #1c2930;
  --axis: #3e4e56;
  --rule: #e9f1f0;
  --border: rgba(233, 241, 240, 0.12);
  --wash: rgba(233, 241, 240, 0.05);
  --wash-strong: rgba(233, 241, 240, 0.09);
  --shadow-tip: 0 6px 18px rgba(0, 0, 0, 0.55);
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
  --series-1: #19a0a0;
  --series-2: #bd8630;
  --series-3: #a24e7b;
  --deemph: #6f7e80;
  --div-pos: #19a0a0;
  --div-neg: #d06551;
  --div-mid: #263239;
  --on-div-3: #0a1216;
  --on-div-2: #e9f1f0;
  --on-div-1: #e9f1f0;
  --on-div-0: #e9f1f0;
  --seq-1: var(--teal-700);
  --seq-2: var(--teal-600);
  --seq-3: color-mix(in oklab, var(--teal-500) 80%, var(--teal-600));
  --seq-4: var(--teal-500);
  --seq-5: var(--teal-400);
  --seq-6: var(--teal-300);
  --seq-7: var(--teal-200);
  --on-seq-1: #e9f1f0;
  --on-seq-2: #e9f1f0;
  --on-seq-3: #0a1216;
  --on-seq-4: #0a1216;
  --on-seq-5: #0a1216;
  --on-seq-6: #0a1216;
  --on-seq-7: #0a1216;
  --missing: #1a252b;
  --status-good: #4cc08a;
  --status-warning: #d39a3a;
  --status-critical: #d9705a;
  --status-neutral: #87999f;
  --on-status-good: #0a1216;
  --on-status-warning: #0a1216;
  --on-status-critical: #0a1216;
  --on-status-neutral: #0a1216;
  --text-good: #5cd6a8;
  --text-critical: #e8927c;
  --focus: #7fe8d2;
}

:root[data-theme="light"] {
  color-scheme: light;
  --page: #eff3f2;
  --surface: #ffffff;
  --raised: #ffffff;
  --ink-1: #14201f;
  --ink-2: #3f4946;
  --ink-3: #5a6461;
  --grid: #e3e9e7;
  --axis: #b0bab7;
  --rule: #14201f;
  --border: rgba(17, 24, 22, 0.13);
  --wash: rgba(17, 24, 22, 0.035);
  --wash-strong: rgba(17, 24, 22, 0.07);
  --shadow-tip: 0 6px 18px rgba(17, 24, 22, 0.12);
  --shadow-card: 0 1px 2px rgba(17, 24, 22, 0.05), 0 4px 16px rgba(17, 24, 22, 0.04);
  --series-1: #099393;
  --series-2: #b6770b;
  --series-3: #8a3362;
  --deemph: #7d8683;
  --div-pos: #099393;
  --div-neg: #bc4b37;
  --div-mid: #e3e9e7;
  --on-div-3: #14201f;
  --on-div-2: #14201f;
  --on-div-1: #14201f;
  --on-div-0: #14201f;
  --seq-1: var(--teal-100);
  --seq-2: var(--teal-200);
  --seq-3: var(--teal-300);
  --seq-4: var(--teal-400);
  --seq-5: var(--teal-500);
  --seq-6: var(--teal-600);
  --seq-7: var(--teal-700);
  --on-seq-1: #14201f;
  --on-seq-2: #14201f;
  --on-seq-3: #14201f;
  --on-seq-4: #14201f;
  --on-seq-5: #14201f;
  --on-seq-6: #ffffff;
  --on-seq-7: #ffffff;
  --missing: #e5eae8;
  --status-good: #157a4a;
  --status-warning: #a86b00;
  --status-critical: #b23a2e;
  --status-neutral: #6f7875;
  --on-status-good: #ffffff;
  --on-status-warning: #ffffff;
  --on-status-critical: #ffffff;
  --on-status-neutral: #ffffff;
  --text-good: #10684a;
  --text-critical: #a3462e;
  --focus: #0b6b5c;
}

/*
 * Print goes light whatever the screen showed, like the results page.
 */
@media print {
  :root,
  :root[data-theme="light"] {
    color-scheme: light;
    --page: #ffffff;
    --surface: #ffffff;
    --raised: #ffffff;
    --ink-1: #000000;
    --ink-2: #2b3330;
    --ink-3: #454e4b;
    --grid: #c7cfcd;
    --axis: #8b9491;
    --rule: #000000;
    --border: rgba(0, 0, 0, 0.32);
    --wash: rgba(0, 0, 0, 0.05);
    --wash-strong: rgba(0, 0, 0, 0.1);
    --shadow-card: none;
    --missing: #eceeed;
    --div-mid: #eceeed;
  }
}
/*
 * techval dashboard layout, set as an application surface.
 *
 * Exhibits sit on cards one step lighter than the ground, and the cards carry
 * the structure that rules used to: each exhibit is its own card, numbered in
 * reading order by a CSS counter, so the numbering can never disagree with
 * the page. The document's voice survives inside the chrome: a serif title,
 * serif standfirsts, verdicts as words. Refusals are notes under the exhibit
 * they belong to, numbered like footnotes. Provenance is a source line. Every
 * colour comes from tokens.css.
 */

*,
*::before,
*::after {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: auto;
}

body {
  margin: 0;
  background: var(--page);
  color: var(--ink-1);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  font-kerning: normal;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

h1,
h2,
h3,
h4,
p {
  margin: 0;
}

h1,
h2,
h3,
h4 {
  text-wrap: balance;
  font-weight: var(--fw-semibold);
  line-height: var(--lh-tight);
}

code,
.tv-mono {
  font-family: var(--font-mono);
  font-size: 0.9em;
}

a {
  color: inherit;
  text-decoration-color: var(--ink-3);
  text-underline-offset: 3px;
}

a:hover {
  text-decoration-color: currentColor;
}

:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

.tv-visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.tv-muted {
  color: var(--ink-2);
}

/* Shell: a contents column and the document. Narrow screens stack them. */

.tv-shell {
  display: block;
  counter-reset: exhibit section;
}

.tv-main {
  min-width: 0;
  max-width: var(--main-max);
  margin: 0 auto;
  padding: var(--space-6) var(--space-4) var(--space-8);
}

.tv-rail {
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--page);
  border-bottom: 1px solid var(--grid);
}

.tv-rail__title {
  display: none;
}

.tv-rail__list {
  display: flex;
  gap: var(--space-4);
  margin: 0;
  /* The vertical padding is the focus ring's room: the scroller clips whatever reaches its padding box. */
  padding: 5px var(--space-4);
  list-style: none;
  overflow-x: auto;
  scrollbar-width: thin;
  counter-reset: contents;
  background-image: linear-gradient(to right, var(--page) 60%, transparent),
    linear-gradient(to left, var(--page) 60%, transparent),
    linear-gradient(to right, var(--border), transparent),
    linear-gradient(to left, var(--border), transparent);
  background-position: left center, right center, left center, right center;
  background-size: 28px 100%, 28px 100%, 18px 100%, 18px 100%;
  background-repeat: no-repeat;
  background-attachment: local, local, scroll, scroll;
}

.tv-rail__list > li {
  counter-increment: contents;
}

.tv-rail__link {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  min-height: 40px;
  padding: var(--space-2) 2px;
  color: var(--ink-2);
  font-size: var(--fs-small);
  font-weight: var(--fw-medium);
  text-decoration: none;
  white-space: nowrap;
}

.tv-rail__link:hover {
  color: var(--ink-1);
}

.tv-rail__link[aria-current="true"] {
  color: var(--ink-1);
  box-shadow: inset 0 -2px 0 var(--focus);
}

/* The contents list names sections; verdicts are read in the sections themselves. */
.tv-rail .tv-chip,
.tv-rail__state {
  display: none;
}

@media (min-width: 1100px) {
  .tv-shell {
    display: grid;
    grid-template-columns: var(--rail-width) minmax(0, 1fr);
    gap: var(--space-7);
    max-width: calc(var(--rail-width) + var(--space-7) + var(--main-max) + 2 * var(--space-6));
    margin: 0 auto;
    padding: 0 var(--space-6);
  }

  .tv-main {
    margin: 0;
    width: 100%;
    padding: var(--space-8) 0;
  }

  .tv-rail {
    align-self: start;
    height: 100vh;
    overflow-y: auto;
    padding: var(--space-8) 0 var(--space-5);
    border-bottom: 0;
  }

  .tv-rail__title {
    display: block;
    margin: 0 0 var(--space-3);
    color: var(--ink-1);
    font-family: var(--font-serif);
    font-size: var(--fs-lead);
  }

  .tv-rail__list {
    flex-direction: column;
    gap: 0;
    padding: 0;
    overflow: visible;
    background-image: none;
  }

  .tv-rail__link {
    border-radius: var(--radius-control);
    min-height: 0;
    margin: 1px 0;
    padding: 7px var(--space-2);
    font-size: var(--fs-small);
    line-height: 1.35;
    white-space: normal;
  }

  .tv-rail__link:hover {
    background: var(--wash);
  }

  .tv-rail__link[aria-current="true"] {
    background: var(--wash-strong);
    box-shadow: none;
  }
}

/* Header: a dateline, the title and a standfirst. Build metadata closes the page. */

.tv-header {
  display: grid;
  gap: var(--space-4);
  padding-bottom: var(--space-6);
}

.tv-dateline {
  display: flex;
  flex-wrap: wrap;
  gap: 0 var(--space-3);
  color: var(--ink-2);
  font-size: var(--fs-small);
}

.tv-dateline > span + span::before {
  content: "·";
  margin-right: var(--space-3);
  color: var(--ink-3);
}

.tv-title {
  max-width: 20ch;
  font-family: var(--font-serif);
  font-size: var(--fs-h1);
  font-weight: 500;
  line-height: 1.04;
  letter-spacing: -0.018em;
}

.tv-standfirst {
  max-width: 62ch;
  color: var(--ink-2);
  font-family: var(--font-serif);
  font-size: 20px;
  line-height: 1.45;
  text-wrap: pretty;
}

.tv-meta {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-1) var(--space-5);
  color: var(--ink-2);
  font-size: var(--fs-small);
}

.tv-meta__label {
  color: var(--ink-3);
  margin-right: var(--space-1);
}

.tv-fixtures {
  font-size: var(--fs-small);
  color: var(--ink-2);
}

.tv-fixtures ul {
  margin: var(--space-2) 0 0;
  padding: 0;
  list-style: none;
  display: grid;
  gap: 2px;
}

.tv-fixtures li {
  display: flex;
  flex-wrap: wrap;
  gap: 0 var(--space-3);
  overflow-wrap: anywhere;
}

.tv-banner {
  padding: var(--space-2) 0 var(--space-2) var(--space-3);
  border-left: 2px solid var(--rule);
  color: var(--ink-1);
  font-size: var(--fs-small);
}

details > summary {
  cursor: pointer;
  width: fit-content;
  color: var(--ink-2);
  font-size: var(--fs-small);
}

details > summary:hover {
  color: var(--ink-1);
}

/* Sections: a numeral and a serif title, then a standfirst. */

.tv-section {
  display: grid;
  gap: var(--space-5);
  padding: 0;
  margin-top: var(--space-8);
  counter-increment: section;
  scroll-margin-top: 56px;
}

.tv-section:first-of-type {
  margin-top: 0;
}

.tv-section__head {
  display: grid;
  gap: var(--space-3);
  max-width: 70ch;
}

.tv-eyebrow {
  display: none;
}

.tv-section__title {
  font-family: var(--font-serif);
  font-size: var(--fs-h2);
  font-weight: 500;
  letter-spacing: -0.01em;
}

.tv-section__title::before {
  content: counter(section, upper-roman) ". ";
  color: var(--ink-3);
}

.tv-takeaway {
  color: var(--ink-2);
  font-family: var(--font-serif);
  font-size: var(--fs-lead);
  line-height: 1.5;
  text-wrap: pretty;
}

.tv-section__body {
  display: grid;
  gap: var(--space-6);
  min-width: 0;
}

@media (min-width: 1100px) {
  .tv-section {
    scroll-margin-top: var(--space-5);
  }
}

/* Headline strip: the verdict word, the model's first sentence, three figures. */

.tv-headline {
  display: grid;
  gap: var(--space-3);
}

.tv-headline__verdict {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--space-1) var(--space-3);
  max-width: 96ch;
}

/* The verdict's first sentence, with the rest of the model's own text behind a disclosure. */
.tv-headline__text {
  display: grid;
  flex: 1 1 32ch;
  gap: var(--space-1);
  color: var(--ink-2);
  font-size: var(--fs-body);
}

.tv-headline__more > p {
  margin-top: var(--space-1);
}

.tv-headline .tv-tiles {
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr));
  gap: var(--space-3);
}

.tv-headline .tv-tile {
  padding: var(--space-3) var(--space-4);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-card);
}

/* Exhibits. Each one a card: a numbered title inside, a source line below. */

.tv-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr));
  gap: var(--space-6) var(--space-6);
  align-items: start;
}

.tv-figure {
  display: grid;
  gap: var(--space-3);
  min-width: 0;
  margin: 0;
  padding: var(--space-4);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-card);
  counter-increment: exhibit;
}

.tv-figure--wide {
  grid-column: 1 / -1;
}

.tv-figure__head {
  display: grid;
  gap: 3px;
}

.tv-figure__title {
  max-width: 72ch;
  font-size: var(--fs-h3);
  font-weight: var(--fw-semibold);
  line-height: 1.35;
}

.tv-figure > .tv-figure__head > .tv-figure__title::before {
  content: "Exhibit " counter(exhibit) ": ";
  color: var(--ink-2);
}

.tv-figure__subtitle {
  max-width: 88ch;
  color: var(--ink-2);
  font-size: var(--fs-small);
}

.tv-figure__legend:empty,
.tv-figure__notes:empty {
  display: none;
}

.tv-figure__body {
  min-width: 0;
}

/* A second figure inside an exhibit, under its own heading. */
.tv-figure__part {
  display: grid;
  gap: var(--space-3);
  margin-top: var(--space-5);
}

.tv-figure__notes {
  display: grid;
  gap: 3px;
  counter-reset: note;
}

.tv-figure__foot {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 2px var(--space-4);
  color: var(--ink-3);
  font-size: var(--fs-micro);
}

.tv-figure__source {
  order: 0;
  min-width: 0;
  color: var(--ink-3);
  font-family: var(--font-mono);
  font-size: var(--fs-micro);
  overflow-wrap: anywhere;
}

.tv-figure__source:not(:empty)::before {
  content: "Source: ";
  color: var(--ink-2);
  font-family: var(--font-sans);
  font-weight: var(--fw-semibold);
}

.tv-figure__foot .tv-btn {
  order: 1;
}

.tv-btn {
  appearance: none;
  min-height: 24px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--ink-2);
  font: inherit;
  font-size: var(--fs-micro);
  font-weight: var(--fw-semibold);
  text-decoration: underline;
  text-decoration-color: var(--ink-3);
  text-underline-offset: 3px;
  cursor: pointer;
}

.tv-btn:hover {
  color: var(--ink-1);
  text-decoration-color: currentColor;
}

/* The closing basis of preparation: what the page was built from. */

.tv-basis {
  display: grid;
  gap: var(--space-3);
  margin-top: var(--space-8);
  padding: var(--space-4);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-card);
  color: var(--ink-2);
  font-size: var(--fs-small);
}

.tv-basis > * {
  max-width: 88ch;
}

.tv-basis__title {
  color: var(--ink-1);
  font-family: var(--font-serif);
  font-size: 22px;
  font-weight: 500;
}

/* Charts. */

.tv-chart {
  position: relative;
  min-width: 0;
  width: 100%;
}

/* A grid with more columns than fit keeps its 24px cells and scrolls on its own. */
.tv-chart--heat {
  overflow-x: auto;
}

.tv-svg {
  display: block;
  overflow: visible;
  font-family: var(--font-sans);
}

.tv-svg text {
  fill: var(--ink-2);
  font-size: var(--fs-micro);
}

.tv-svg .tv-tick {
  font-variant-numeric: tabular-nums;
}

.tv-svg .tv-label {
  fill: var(--ink-1);
  font-size: var(--fs-small);
}

/* Value labels sit above reference rules; a surface halo keeps a rule from striking through them. */
.tv-svg .tv-value {
  fill: var(--ink-2);
  font-size: var(--fs-micro);
  font-weight: var(--fw-medium);
  paint-order: stroke;
  stroke: var(--surface);
  stroke-width: 3px;
  stroke-linejoin: round;
}

.tv-values {
  pointer-events: none;
}

.tv-svg .tv-endlabel {
  fill: var(--ink-1);
  font-size: var(--fs-small);
  font-weight: var(--fw-medium);
}

.tv-svg .tv-ref-label {
  fill: var(--ink-1);
  font-size: var(--fs-micro);
  font-weight: var(--fw-medium);
  paint-order: stroke;
  stroke: var(--surface);
  stroke-width: 3px;
  stroke-linejoin: round;
}

.tv-svg .tv-group-label {
  fill: var(--ink-2);
  font-size: var(--fs-micro);
  font-weight: var(--fw-medium);
}

.tv-svg .tv-cell-label {
  font-size: var(--fs-micro);
  font-variant-numeric: tabular-nums;
  pointer-events: none;
}

.tv-svg .tv-cell-label--base {
  font-weight: var(--fw-semibold);
}

.tv-svg .tv-heat-base {
  fill: none;
  stroke: var(--ink-1);
  stroke-width: 1.5;
  pointer-events: none;
}

.tv-gridline {
  stroke: var(--grid);
  stroke-width: 1;
  shape-rendering: crispEdges;
}

.tv-axisline {
  stroke: var(--axis);
  stroke-width: 1;
  shape-rendering: crispEdges;
}

.tv-ref {
  stroke: var(--ink-2);
  stroke-width: 1;
  shape-rendering: crispEdges;
}

.tv-ref--strong {
  stroke: var(--ink-1);
}

.tv-connector {
  stroke: var(--axis);
  stroke-width: 1;
  shape-rendering: crispEdges;
}

.tv-crosshair {
  stroke: var(--ink-3);
  stroke-width: 1;
  shape-rendering: crispEdges;
  pointer-events: none;
}

.tv-line {
  fill: none;
  stroke-width: 2;
  stroke-linejoin: round;
  stroke-linecap: round;
}

.tv-band {
  fill-opacity: 0.1;
  stroke: none;
}

.tv-shade {
  fill: var(--wash-strong);
  stroke: none;
}

.tv-whisker {
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
}

.tv-dot {
  stroke: var(--surface);
  stroke-width: 2;
}

.tv-hairline {
  stroke: var(--axis);
  stroke-width: 1;
}

.tv-hit {
  fill: transparent;
  stroke: none;
}

.tv-markg {
  cursor: default;
  outline: none;
}

.tv-markg.is-hot .tv-hit {
  fill: var(--wash);
}

.tv-markg.is-hot .tv-mark {
  filter: brightness(1.1) saturate(1.05);
}

.tv-markg:focus-visible .tv-hit {
  stroke: var(--focus);
  stroke-width: 1.5;
}

.tv-plot {
  outline: none;
}

.tv-plot:focus-visible .tv-hit {
  stroke: var(--focus);
  stroke-width: 1.5;
}

@media (prefers-reduced-motion: no-preference) {
  .tv-mark,
  .tv-hit {
    transition: filter 120ms ease-out, fill 120ms ease-out;
  }

  /* App-chrome motion: a card lifts a step on hover, and verdict tiles rise once on load. */
  .tv-figure,
  .tv-tileset {
    transition: box-shadow 120ms ease-out, transform 120ms ease-out;
  }

  .tv-figure:hover,
  .tv-tileset:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow-tip);
  }

  @keyframes tv-rise {
    from {
      opacity: 0;
      transform: translateY(5px);
    }
    to {
      opacity: 1;
      transform: none;
    }
  }

  .tv-headline .tv-tile {
    animation: tv-rise 240ms ease-out backwards;
  }

  .tv-headline .tv-tile:nth-child(2) {
    animation-delay: 50ms;
  }

  .tv-headline .tv-tile:nth-child(3) {
    animation-delay: 100ms;
  }
}

.tv-empty {
  padding: var(--space-5) 0;
  color: var(--ink-2);
  font-size: var(--fs-small);
}

/* Legends, including the heat scale. */

.tv-legend {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-1) var(--space-4);
  margin: 0;
  padding: 0;
  list-style: none;
  color: var(--ink-2);
  font-size: var(--fs-small);
}

.tv-legend__item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.tv-key {
  display: inline-block;
  flex: none;
  background: var(--key, var(--ink-3));
}

.tv-key--rect {
  width: 10px;
  height: 10px;
  border-radius: 2px;
}

.tv-key--line {
  width: 14px;
  height: 2px;
  border-radius: 1px;
}

.tv-key--dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

/* A hollow marker, for rows drawn hollow. */
.tv-key--ring {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: transparent;
  box-shadow: inset 0 0 0 1.5px var(--key, var(--ink-3));
}

.tv-scale {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: var(--space-2) var(--space-5);
  margin-top: var(--space-3);
  color: var(--ink-2);
  font-size: var(--fs-micro);
}

.tv-scale__ramp {
  display: grid;
  justify-items: start;
  gap: 4px;
}

/* The ticks take the swatches' width, so 0 sits at the middle of the ramp and the bounds at its ends. */
.tv-scale__bar {
  display: grid;
  gap: 4px;
}

.tv-scale__title {
  color: var(--ink-2);
  font-size: var(--fs-micro);
}

.tv-scale__swatches {
  display: flex;
  gap: 2px;
}

.tv-scale__swatch {
  width: 28px;
  height: 10px;
}

.tv-scale__swatch:first-child {
  border-radius: 2px 0 0 2px;
}

.tv-scale__swatch:last-child {
  border-radius: 0 2px 2px 0;
}

.tv-scale__ticks {
  position: relative;
  height: 1.5em;
  font-variant-numeric: tabular-nums;
}

.tv-scale__ticks > span {
  position: absolute;
  top: 0;
  white-space: nowrap;
}

.tv-scale__ticks > span:first-child {
  left: 0;
}

.tv-scale__ticks > span:last-child {
  right: 0;
}

.tv-scale__ticks > span:not(:first-child):not(:last-child) {
  left: 50%;
  transform: translateX(-50%);
}

.tv-scale__missing {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  align-self: flex-end;
}

/* Tooltip: the one lifted surface on the page. */

.tv-tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  min-width: 140px;
  max-width: 300px;
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-control);
  background: var(--raised);
  box-shadow: 0 0 0 1px var(--border), var(--shadow-tip);
  color: var(--ink-1);
  font-size: var(--fs-small);
  pointer-events: none;
}

.tv-tooltip__title {
  margin-bottom: 4px;
  color: var(--ink-2);
  font-size: var(--fs-micro);
  font-weight: var(--fw-medium);
}

.tv-tooltip__rows {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 3px var(--space-2);
}

.tv-tooltip__label {
  color: var(--ink-2);
}

.tv-tooltip__value {
  justify-self: end;
  color: var(--ink-1);
  font-weight: var(--fw-semibold);
  font-variant-numeric: tabular-nums;
}

.tv-tooltip__nokey {
  width: 14px;
}

/* Tables, set the way financial tables are: rules, not boxes; headers in sentence case. */

/*
 * A table wider than its box scrolls inside it. Four layers say so: two covers
 * painted on the content, which scroll away as the reader moves, and two
 * shadows painted on the box, which they uncover. A shadow therefore shows on
 * a side only while there are columns out of view on that side.
 */
.tv-table-wrap {
  overflow-x: auto;
  max-width: 100%;
  background-image: linear-gradient(to right, var(--surface) 60%, transparent),
    linear-gradient(to left, var(--surface) 60%, transparent),
    linear-gradient(to right, var(--border), transparent),
    linear-gradient(to left, var(--border), transparent);
  background-position: left center, right center, left center, right center;
  background-size: 28px 100%, 28px 100%, 18px 100%, 18px 100%;
  background-repeat: no-repeat;
  background-attachment: local, local, scroll, scroll;
}

.tv-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--fs-small);
  font-variant-numeric: lining-nums;
}

.tv-table th,
.tv-table td {
  padding: 5px var(--space-4) 5px 0;
  border-bottom: 1px solid var(--grid);
  text-align: left;
  vertical-align: top;
}

.tv-table thead th {
  color: var(--ink-3);
  font-size: var(--fs-micro);
  font-weight: var(--fw-medium);
  text-transform: uppercase;
  letter-spacing: var(--tracking-caps);
  vertical-align: bottom;
  white-space: nowrap;
  border-bottom: 1px solid var(--axis);
}

.tv-table tbody tr:last-child > :is(th, td) {
  border-bottom-color: var(--axis);
}

.tv-table tbody th {
  font-weight: var(--fw-medium);
}

.tv-table tbody tr:hover > :is(th, td) {
  background: var(--wash);
}

.tv-table .tv-pos {
  color: var(--text-good);
}

.tv-table .tv-neg {
  color: var(--text-critical);
}

.tv-table .tv-num {
  text-align: right;
  font-variant-numeric: tabular-nums lining-nums;
  white-space: nowrap;
}

.tv-table td.tv-mono,
.tv-table th.tv-mono {
  font-size: var(--fs-micro);
  overflow-wrap: anywhere;
}

.tv-table .tv-nowrap {
  white-space: nowrap;
}

.tv-table :is(th, td):last-child {
  padding-right: 0;
}

/*
 * Verdicts are words, set the way a research note sets a rating. A small square
 * in the status hue sits beside the word; the word alone carries the meaning.
 */

.tv-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  flex: none;
  padding: 0;
  color: var(--ink-1);
  font-size: var(--fs-micro);
  font-weight: var(--fw-semibold);
  letter-spacing: var(--tracking-caps);
  line-height: 1.3;
  text-transform: uppercase;
  white-space: nowrap;
}

.tv-chip::before {
  content: "";
  flex: none;
  width: 7px;
  height: 7px;
  background: var(--chip-hue);
}

.tv-chip__icon {
  display: none;
}

.tv-chip--good {
  --chip-hue: var(--status-good);
  --chip-on: var(--on-status-good);
}

.tv-chip--warning {
  --chip-hue: var(--status-warning);
  --chip-on: var(--on-status-warning);
}

.tv-chip--critical {
  --chip-hue: var(--status-critical);
  --chip-on: var(--on-status-critical);
}

.tv-chip--neutral {
  --chip-hue: var(--status-neutral);
  --chip-on: var(--on-status-neutral);
}

.tv-chip--compact {
  color: var(--ink-2);
}

/* Inside a table a verdict is one cell among many, so it drops the capitals. */
.tv-table .tv-chip {
  color: var(--ink-2);
  font-size: var(--fs-small);
  font-weight: var(--fw-regular);
  letter-spacing: 0;
  text-transform: none;
}

/* Figures set as key data: a small label above a plain number, no rules, no boxes. */

.tv-tiles {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 180px), 1fr));
  gap: var(--space-3) var(--space-6);
}

.tv-tileset {
  display: grid;
  gap: var(--space-2);
  min-width: 0;
  padding: var(--space-4);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-card);
}

.tv-tileset__body {
  display: grid;
  gap: var(--space-2);
}

.tv-tileset__title {
  color: var(--ink-1);
  font-size: var(--fs-h3);
  font-weight: var(--fw-semibold);
}

.tv-tile {
  display: grid;
  align-content: start;
  gap: 1px;
  min-width: 0;
  color: inherit;
  text-decoration: none;
}

a.tv-tile:hover .tv-tile__label {
  color: var(--ink-1);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.tv-tile__label {
  color: var(--ink-2);
  font-size: var(--fs-micro);
  font-weight: var(--fw-medium);
}

.tv-tile__value {
  color: var(--ink-1);
  font-size: var(--fs-figure);
  font-weight: 500;
  line-height: 1.15;
  letter-spacing: -0.01em;
  overflow-wrap: anywhere;
}

.tv-tile__sub {
  color: var(--ink-3);
  font-size: var(--fs-micro);
  line-height: 1.45;
}

.tv-tile .tv-chip {
  justify-self: start;
  margin-top: var(--space-1);
}

.tv-delta {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: var(--fs-micro);
  font-weight: var(--fw-medium);
  color: var(--ink-2);
}

.tv-delta__icon {
  width: 9px;
  height: 9px;
  fill: currentColor;
}

.tv-delta--good {
  color: var(--text-good);
}

.tv-delta--bad {
  color: var(--text-critical);
}

.tv-delta__label {
  color: var(--ink-2);
  font-weight: var(--fw-regular);
}

/* Notes and refusals, numbered like footnotes under what they qualify. */

.tv-note {
  display: block;
  max-width: 100ch;
  color: var(--ink-2);
  font-size: var(--fs-micro);
  line-height: 1.5;
  counter-increment: note;
}

.tv-note::before {
  content: counter(note) ". ";
  color: var(--ink-3);
  font-weight: var(--fw-semibold);
  font-variant-numeric: tabular-nums;
}

.tv-note .tv-chip__icon {
  display: none;
}

.tv-note > p {
  display: inline;
}

.tv-note strong {
  color: var(--ink-1);
  font-weight: var(--fw-semibold);
}

.tv-section__notes {
  display: grid;
  gap: 3px;
  padding-top: var(--space-3);
  border-top: 1px solid var(--grid);
  counter-reset: note;
}

.tv-section__notes::before {
  content: "Notes";
  margin-bottom: var(--space-1);
  color: var(--ink-1);
  font-size: var(--fs-small);
  font-weight: var(--fw-semibold);
}

.tv-refusal {
  display: grid;
  gap: var(--space-3);
  max-width: 88ch;
  padding: var(--space-3) 0;
  border-top: 1px solid var(--grid);
  border-bottom: 1px solid var(--grid);
}

.tv-refusal__head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--space-1) var(--space-3);
  color: var(--ink-2);
}

.tv-refusal__list {
  display: grid;
  gap: var(--space-2);
  margin: 0;
  padding: 0;
  list-style: none;
}

.tv-refusal__what {
  font-weight: var(--fw-semibold);
}

.tv-refusal__why {
  color: var(--ink-2);
}

.tv-placeholder {
  display: grid;
  gap: 2px;
  max-width: 88ch;
  padding: var(--space-3) 0;
  border-top: 1px solid var(--grid);
  color: var(--ink-2);
}

.tv-placeholder__title {
  color: var(--ink-1);
  font-weight: var(--fw-semibold);
}

/* Provenance. */

.tv-provenance {
  display: grid;
  gap: var(--space-2);
}

.tv-provenance[open] > summary {
  margin-bottom: var(--space-2);
}

/*
 * Print. The contents list and every control are screen furniture, so they go.
 * What is left is the note: a section to a page, no exhibit split across a
 * break, and charts scaled to whatever paper the reader has.
 */
@media print {
  .tv-shell {
    display: block;
    max-width: none;
    padding: 0;
  }

  .tv-main {
    width: auto;
    max-width: none;
    margin: 0;
    padding: 0;
  }

  .tv-rail,
  .tv-btn {
    display: none;
  }

  .tv-section {
    break-before: page;
    margin-top: 0;
  }

  .tv-section:first-of-type {
    break-before: auto;
  }

  .tv-figure,
  .tv-tileset,
  .tv-headline,
  .tv-refusal,
  .tv-note,
  .tv-basis {
    break-inside: avoid;
  }

  .tv-section__head,
  .tv-figure__head {
    break-after: avoid;
  }

  /* On paper a scroller cannot scroll, so the table prints whole and drops its cue. */
  .tv-table-wrap {
    overflow: visible;
    background-image: none;
  }

  .tv-svg {
    max-width: 100%;
    height: auto;
  }

  /* A link to a section of the same page is a page number on paper, not a link. */
  a[href^="#"] {
    text-decoration: none;
  }
}
/*
 * The investing app shell: a left rail, a sticky top bar, and panes of cards.
 *
 * Chart figures, tables, tooltips and chips are the dashboard components,
 * styled in the inlined layout.css; this file only sets the shell around them
 * and the pieces the results page does not have: the rail, the hero, the tile
 * row, the sortable book. Every colour comes through tokens, and the only
 * signed colours are gains and losses.
 */

body {
  background: var(--page);
  color: var(--ink-1);
}

.iv-shell {
  display: grid;
  grid-template-columns: 216px minmax(0, 1fr);
  gap: var(--space-6);
  max-width: 1320px;
  margin: 0 auto;
  padding: var(--space-5) var(--space-5) var(--space-8);
}

/* The rail ---------------------------------------------------------------- */

.iv-rail {
  position: sticky;
  top: var(--space-5);
  align-self: start;
  display: grid;
  gap: var(--space-5);
}

.iv-brand {
  display: grid;
  gap: 1px;
  padding: 2px var(--space-2) 0;
}

.iv-brand__name {
  font-family: var(--font-serif);
  font-size: 21px;
  font-weight: 500;
  letter-spacing: -0.01em;
}

.iv-brand__sub {
  color: var(--ink-3);
  font-size: var(--fs-micro);
  font-weight: var(--fw-medium);
  text-transform: uppercase;
  letter-spacing: var(--tracking-caps);
}

.iv-nav {
  display: grid;
  gap: 2px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.iv-nav__link {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: 8px var(--space-3);
  border-radius: var(--radius-control);
  color: var(--ink-2);
  font-size: var(--fs-body);
  font-weight: var(--fw-medium);
  text-decoration: none;
  white-space: nowrap;
}

.iv-nav__link svg {
  flex: none;
  width: 16px;
  height: 16px;
  stroke: currentColor;
  stroke-width: 1.6;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0.85;
}

.iv-nav__link:hover {
  background: var(--wash);
  color: var(--ink-1);
}

.iv-nav__link[aria-current="page"] {
  background: var(--wash-strong);
  color: var(--ink-1);
  box-shadow: inset 2px 0 0 var(--focus);
}

.iv-rail__meta {
  display: grid;
  gap: 2px;
  padding: 0 var(--space-3);
  color: var(--ink-3);
  font-size: var(--fs-micro);
}

/* The top bar -------------------------------------------------------------- */

.iv-main {
  display: grid;
  gap: var(--space-5);
  min-width: 0;
  align-content: start;
}

.iv-topbar {
  display: flex;
  align-items: baseline;
  gap: var(--space-4);
}

.iv-topbar__title {
  font-size: 21px;
  font-weight: var(--fw-semibold);
  letter-spacing: -0.01em;
}

.iv-topbar__meta {
  color: var(--ink-3);
  font-size: var(--fs-small);
}

.iv-topbar .tv-btn {
  margin-left: auto;
}

/* Panes and cards ----------------------------------------------------------- */

.iv-pane {
  display: grid;
  gap: var(--space-5);
  min-width: 0;
}

.iv-card {
  display: grid;
  gap: var(--space-3);
  min-width: 0;
  padding: var(--space-4);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-card);
}

.iv-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  gap: var(--space-5);
  align-items: start;
}

/* The hero ------------------------------------------------------------------ */

.iv-hero {
  display: grid;
  gap: var(--space-1);
}

.iv-hero__label {
  color: var(--ink-3);
  font-size: var(--fs-micro);
  font-weight: var(--fw-medium);
  text-transform: uppercase;
  letter-spacing: var(--tracking-caps);
}

.iv-hero__value {
  font-size: 42px;
  font-weight: var(--fw-semibold);
  letter-spacing: -0.02em;
  line-height: 1.05;
  font-variant-numeric: tabular-nums lining-nums;
}

.iv-hero__delta {
  display: flex;
  flex-wrap: wrap;
  gap: 2px var(--space-3);
  font-size: var(--fs-small);
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}

.iv-pos {
  color: var(--text-good);
}

.iv-neg {
  color: var(--text-critical);
}

/* Tiles ---------------------------------------------------------------------- */

.iv-tiles {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr));
  gap: var(--space-3);
}

.iv-tile {
  display: grid;
  align-content: start;
  gap: 2px;
  padding: var(--space-3) var(--space-4);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-card);
}

.iv-tile__label {
  color: var(--ink-3);
  font-size: var(--fs-micro);
  font-weight: var(--fw-medium);
  text-transform: uppercase;
  letter-spacing: var(--tracking-caps);
}

.iv-tile__value {
  font-size: 22px;
  font-weight: var(--fw-semibold);
  letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums lining-nums;
}

.iv-tile__sub {
  color: var(--ink-3);
  font-size: var(--fs-micro);
  line-height: 1.45;
}

/* One featured tile carries a slow teal drift; everything else stays still. */
.iv-tile--feature {
  border-color: var(--focus);
  background-image: linear-gradient(120deg, var(--wash-strong), var(--wash), var(--wash-strong));
  background-size: 220% 100%;
}

/* The book: a dense sortable table ------------------------------------------- */

.iv-book th[aria-sort] {
  cursor: pointer;
  user-select: none;
}

.iv-book th[aria-sort]:hover {
  color: var(--ink-1);
}

.iv-book th[aria-sort="ascending"]::after {
  content: " \2191";
}

.iv-book th[aria-sort="descending"]::after {
  content: " \2193";
}

.iv-book .tv-table td {
  white-space: nowrap;
}

.iv-group {
  color: var(--ink-3);
  font-size: var(--fs-micro);
  font-weight: var(--fw-medium);
  text-transform: uppercase;
  letter-spacing: var(--tracking-caps);
  padding-top: var(--space-3);
}

/* Figures keep the kit's chrome but drop the document's exhibit numbering. */
.iv-pane .tv-figure > .tv-figure__head > .tv-figure__title::before {
  content: none;
}

/* Notes and refusals reuse the page's own vocabulary. */
.iv-note {
  color: var(--ink-2);
  font-size: var(--fs-small);
  max-width: 88ch;
}

.iv-banner {
  padding: var(--space-3) var(--space-4);
  background: var(--wash);
  border: 1px solid var(--border);
  border-left: 3px solid var(--status-warning);
  border-radius: var(--radius-control);
  color: var(--ink-1);
  font-size: var(--fs-small);
  max-width: none;
}

/* Small screens: the rail becomes a scrolling tab strip. --------------------- */

@media (max-width: 900px) {
  .iv-shell {
    display: block;
    padding: 0 var(--space-4) var(--space-7);
  }

  .iv-rail {
    position: sticky;
    top: 0;
    z-index: 5;
    grid-template-columns: 1fr;
    margin: 0 calc(-1 * var(--space-4)) var(--space-4);
    padding: var(--space-2) var(--space-4) 0;
    background: var(--page);
    border-bottom: 1px solid var(--grid);
    gap: var(--space-2);
  }

  .iv-brand {
    padding: 0;
  }

  .iv-brand__sub,
  .iv-rail__meta {
    display: none;
  }

  .iv-nav {
    display: flex;
    gap: var(--space-2);
    overflow-x: auto;
    scrollbar-width: thin;
    padding-bottom: var(--space-1);
  }

  .iv-nav__link {
    padding: 6px var(--space-2);
  }

  .iv-nav__link[aria-current="page"] {
    box-shadow: inset 0 -2px 0 var(--focus);
    background: none;
  }

  .iv-nav__link svg {
    display: none;
  }

  .iv-hero__value {
    font-size: 34px;
  }
}

/* Motion, all of it behind the gate. ------------------------------------------ */

@media (prefers-reduced-motion: no-preference) {
  .iv-card,
  .iv-tile {
    transition: box-shadow 120ms ease-out, transform 120ms ease-out;
  }

  .iv-card:hover,
  .iv-tile:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow-tip);
  }

  @keyframes iv-enter {
    from {
      opacity: 0;
      transform: translateY(6px);
    }
    to {
      opacity: 1;
      transform: none;
    }
  }

  .iv-pane.is-entering > * {
    animation: iv-enter 200ms ease-out backwards;
  }

  .iv-pane.is-entering > :nth-child(2) {
    animation-delay: 40ms;
  }

  .iv-pane.is-entering > :nth-child(3) {
    animation-delay: 80ms;
  }

  .iv-pane.is-entering > :nth-child(n + 4) {
    animation-delay: 120ms;
  }

  @keyframes iv-drift {
    from {
      background-position: 0% 50%;
    }
    50% {
      background-position: 100% 50%;
    }
    to {
      background-position: 0% 50%;
    }
  }

  .iv-tile--feature {
    animation: iv-drift 9s ease-in-out infinite;
  }
}

<script data-asset="kit.js">
/*
 * techval dashboard chart kit: window.TV.
 *
 * Every element is built with TV.el or TV.svg and every piece of data enters
 * the DOM as a text node. Series names, tickers and figure titles are data, so
 * nothing in this file writes markup from a string.
 *
 * Colours are never hex values here. Marks are painted with var(--token)
 * references, so a theme change repaints a chart without redrawing it, and
 * colour follows the entity: a series with role "model" is --c-model wherever
 * it appears. The roles are model, model-muted (the baseline grey, for a second
 * reading of the same model drawn behind the first), baseline, alt (the one named
 * comparison), third, total, and pos and neg for diverging bars.
 *
 * Mark rules the kit enforces rather than suggests: bars at most 24px thick
 * with a 4px rounded data end and a square baseline end, 2px lines with round
 * joins, markers of radius 4 with a 2px surface ring, solid 1px hairlines for
 * grids and references, one y axis, a legend only for two or more series, and
 * a table view for every chart so no value is reachable only by hover. A
 * figure is one tab stop, and the arrow keys walk its marks.
 *
 * Options every chart reads, beyond its own data:
 *
 *   legend        false (or []) draws no legend; a list of {label, role or
 *                 color, shape} draws exactly that list.
 *   table         a fuller table view in place of the drawn series: one
 *                 {columns, rows, caption} or a list of them. A cell may be a
 *                 string, a number, a node, or {text, sub, chip, mono, muted}.
 *   tableHeaders  {key: header} renames a column of the chart's own table.
 *   reference     rules at a value, labelled. A horizontal rule's label is
 *                 measured and set where it touches no mark: the right end
 *                 above or below the rule, then the left end, then outside
 *                 the plot beyond its right edge.
 *   labelWidth    where hbar, dot and range wrap their row labels: pixels, or
 *                 a share of the chart's width when at most 1 (default 0.34).
 *
 * Chart by chart, what is not obvious from the data:
 *
 *   hbar    rows [{label, value, role, note, lo, hi}]; lo and hi draw a whisker.
 *   column  rows [{label, value, role, labelled}]; diverging colours by sign.
 *           Column labels are thinned to fit and the first and last always
 *           stay. One value label names the highest bar, and the lowest when it
 *           is negative; where any row carries labelled, the flagged rows carry
 *           the labels instead. labels "all" labels every bar.
 *   dot     series [{key, name, role}] and rows [{label, values, lo, hi,
 *           intervals: {key: {lo, hi}}, group, text, tip, role, hollow,
 *           aside, asideStrong, labelled, gap}]. A value label names only the
 *           value of the dot it sits beside. labels: "none", "all", or
 *           {series, rows: "auto" | "all" | "flagged" | [index], text: "value"
 *           | "gap"}; by default the row that stands out (largest gap for two
 *           series, largest value otherwise) is labelled, and a row that
 *           carries text is labelled with that text instead. Points closer
 *           than a marker are drawn apart vertically, the row growing to hold
 *           them, unless dodge is false.
 *           aside is a column of text at the right edge, under asideHeader.
 *   line    series [{name, role, values: [{x, y, lo, hi}]}]; x {label,
 *           format, type: "date"}; yScale "log"; yTitle; shade [{from, to,
 *           label, tip}] with shadeLegend; points [{x, y, label, tip}].
 *   heat    rows, cols, values; scale "diverging" or sequential; breaks [a, b]
 *           for fixed diverging classes; mono and labelAlign for row labels,
 *           which are never clipped (labelWidth wraps them); groups [{label,
 *           count}]; colTitle; cellMax; rowNotes; rowTips. scale "plain" sets
 *           the grid as a banker's table: no fill, a rule under each row, no
 *           scale legend, and base [row, col] boxes the base case.
 *   hist    edges and series [{name, role, counts}], at most two series.
 *   range   rows [{label, lo, mid, hi, role}], the football field.
 *   waterfall start, steps [{label, value}] and total; its legend lists only
 *           the kinds of step it draws.
 *   table   columns and rows, drawn as the figure itself.
 *   tiles   tiles [{label, value, format, sub, delta, status}]. Inside a
 *           figure card they carry their own table view.
 *
 * Figures in a section: TV.sections.figures(root, data, opts) draws each
 * figure by its kind, in reading order. A figure may carry order (a number),
 * wide, card (tiles drawn in a card), part (the id of the card it is drawn

 *
 *   order     a list of ids, lists of ids, or {title, ids}; each list starts
 *             a new group, a titled group gets a heading. Unnamed figures
 *             follow in their own order.
 *   figures   {id: override} merged over the snapshot's figure; its data may
 *             be a function of the figure's data, and draw or after a
 *             function of (handle, figure).
 *   parts     {childId: parentId}, the same as part on the figure.
 *   refusals  function (id, figure) returning more refusal names.
 *
 * Helpers the sections share: TV.frame (a chart container redrawn when its
 * width changes), TV.axis.x, TV.axis.y and TV.axis.yWidth, TV.tickFormat,
 * TV.measure (sans or mono), TV.wrapText, TV.thinLabels, TV.markGroup,

    refs.forEach(function (ref, i) {
      var px = crisp(x(ref.value));
      g.appendChild(
        svg("line", { class: "tv-ref" + (strong ? " tv-ref--strong" : ""), x1: px, x2: px, y1: top - 4, y2: bottom })
      );
      var text = ref.label || format(spec.format, ref.value);
      var w = measure(text, 11, 500);
      var lx = clamp(px, x.range[0] + w / 2, x.range[1] - w / 2);
      g.appendChild(
        svg("text", { class: "tv-ref-label", x: lx, y: top - 10 - (refs.length - 1 - i) * 14, "text-anchor": "middle" }, text)
      );
    });
    return refs.length ? refs.length * 14 + 6 : 0;
  }

  /*
   * Where each horizontal reference label goes. Tried in turn: the right end
   * above the rule, the right end below it, the left end above and the left
   * end below; the first spot that touches no obstacle (a bar, a value label,
   * a line, another reference label) wins. With none free the label goes
   * outside the plot beyond its right edge, and outside is how much room that
   * needs. forced keeps a label outside once a caller has made room for it.
   */
  function placeHorizontalRefs(spec, y, left, right, top, bottom, obstacles, forced) {
    var list = [];
    var outside = 0;
    var taken = [];
    (spec.reference || []).forEach(function (ref) {
      if (!ref || !isNum(ref.value)) return;
      var index = list.length;
      var py = crisp(y(ref.value));
      var item = { ref: ref, py: py, text: ref.label ? String(ref.label) : "", outside: false };
      list.push(item);
      if (!item.text) return;
      var w = measure(item.text, 11, 500);
      item.width = w;
      var spots = [
        { x: right - 4, anchor: "end", base: py - 5 },
        { x: right - 4, anchor: "end", base: py + 13 },
        { x: left + 4, anchor: "start", base: py - 5 },
        { x: left + 4, anchor: "start", base: py + 13 },
      ];
      var chosen = null;
      if (!(forced && forced[index])) {
        for (var k = 0; k < spots.length && !chosen; k++) {
          var box = labelBox(spots[k].x, spots[k].base, w, spots[k].anchor);
          if (box.y < 0 || box.y + box.h > bottom + 2) continue;
          if (hits(box, obstacles) || hits(box, taken)) continue;
          chosen = spots[k];
          taken.push({ rect: box });
        }
      }
      if (chosen) {
        item.x = chosen.x;
        item.y = chosen.base;
        item.anchor = chosen.anchor;
      } else {
        item.outside = true;
        item.x = right + 6;
        item.y = py + 4;
        item.anchor = "start";
        outside = Math.max(outside, w + 12);
      }
    });
    /* Outside labels never sit on each other. */
    var out = list
      .filter(function (d) {
        return d.outside && d.text;
      })
      .sort(function (a, b) {
        return a.y - b.y;
      });
    for (var i = 1; i < out.length; i++) {
      if (out[i].y - out[i - 1].y < 13) out[i].y = out[i - 1].y + 13;
    }
    return { list: list, outside: outside };
  }

  function drawHorizontalRefs(g, placed, left, right) {
    placed.list.forEach(function (item) {
      g.appendChild(svg("line", { class: "tv-ref", x1: left, x2: right, y1: item.py, y2: item.py }));
    });
    placed.list.forEach(function (item) {
      if (!item.text) return;
      g.appendChild(
        svg("text", { class: "tv-ref-label", x: item.x, y: item.y, "text-anchor": item.anchor }, item.text)
      );
    });
  }

  function roleLegend(body, spec, roles, shape) {
    var names = spec.roleLabels || {};
    chartLegend(
      body,
      spec,
      roles.map(function (role) {
        return { label: names[role] || ROLE_LABELS[role] || role, color: role, shape: shape };
      }),
      shape
    );
  }

  /*
   * Category rows with wrapped labels, shared by hbar, dot and range. cap is the
   * spec's labelWidth: pixels, or a share of the chart's width when at most 1,
   * so a chart that redraws on resize keeps its proportions.
   */
  function rowLabels(rows, width, cap) {
    var maxWidth =
      isNum(cap) && cap > 0 && cap <= 1
        ? Math.min(Math.max(80, width * cap), 240)
        : isNum(cap)
          ? cap
          : Math.min(Math.max(80, width * 0.34), 240);
    var wrapped = rows.map(function (r) {
      return wrapText(r.label, maxWidth, 12, 2);
    });
    var labelWidth = Math.max.apply(
      null,
      [40].concat(
        wrapped.map(function (w) {
          return w.width;
        })
      )
    );
    return { wrapped: wrapped, width: Math.min(labelWidth, width * 0.5) };
  }

  /* A whisker from lo to hi with end caps, centred on cy. */
  function whisker(x0, x1, cy, cap, stroke) {
    return [
      svg("line", { class: "tv-whisker tv-mark", x1: x0, x2: x1, y1: cy, y2: cy, style: { stroke: stroke } }),
      svg("line", { class: "tv-whisker tv-mark", x1: x0, x2: x0, y1: cy - cap, y2: cy + cap, style: { stroke: stroke } }),
      svg("line", { class: "tv-whisker tv-mark", x1: x1, x2: x1, y1: cy - cap, y2: cy + cap, style: { stroke: stroke } }),
    ];
  }

  /* hbar ------------------------------------------------------------------ */

  function hbar(body, spec) {
    spec = spec || {};
    var rows = (spec.rows || []).filter(Boolean);
    var valueName = spec.valueLabel || "Value";
    var hasInterval = rows.some(function (r) {
      return isNum(r.lo) && isNum(r.hi);
    });
    var columns = [
      { key: "label", label: spec.labelHeader || "Label" },
      { key: "value", label: valueName, align: "right", format: spec.format },
    ];
    if (hasInterval) {
      columns.push({ key: "lo", label: "Low", align: "right", format: spec.format });
      columns.push({ key: "hi", label: "High", align: "right", format: spec.format });
    }
    tableFor(body, { columns: columns, rows: rows }, spec);
    if (!rows.length) return empty(body);
    roleLegend(
      body,
      spec,
      distinct(
        rows.map(function (r) {
          return r.role || "model";
        })
      ),
      "rect"
    );

    frame(body, "hbar", function (wrap, W) {
      var values = [];
      rows.forEach(function (r) {
        values.push(r.value, r.lo, r.hi);
      });
      values = finite(values);
      var refs = referenceValues(spec);
      var dom = spec.domain || [];
      var lo = isNum(dom[0]) ? dom[0] : Math.min.apply(null, [0].concat(values, refs));
      var hi = isNum(dom[1]) ? dom[1] : Math.max.apply(null, [0].concat(values, refs));
      var labels = rowLabels(rows, W, spec.labelWidth);
      var mode = spec.labels || (rows.length <= 12 ? "all" : "extreme");
      var valueWidth =
        mode === "none"
          ? 0
          : Math.max.apply(
              null,
              [0].concat(
                rows.map(function (r) {
                  return measure(format(spec.format, r.value), 11, 500);
                })
              )
            ) + 8;
      var refBand = (spec.reference || []).length * 14 + ((spec.reference || []).length ? 8 : 0);
      var m = {
        top: 6 + refBand,
        right: 8 + (hi > 0 ? valueWidth : 0),
        bottom: 26,
        left: labels.width + 12 + (lo < 0 ? valueWidth : 0),
      };
      var n = rows.length;
      var rowH = spec.height ? Math.max(HIT_MIN, (spec.height - m.top - m.bottom) / n) : 32;
      var plotH = rowH * n;
      var H = Math.round(m.top + plotH + m.bottom);
      var x = linear([lo, hi], [m.left, W - m.right], { nice: !spec.domain });
      var y = band(
        rows.map(function (_, i) {
          return i;
        }),
        [m.top, m.top + plotH],
        { padding: 0.3 }
      );
      var thick = Math.min(BAR_MAX, y.bandwidth());
      var root = chartSvg(W, H, spec, "Bar");
      var grid = svg("g");
      xAxisTicks(grid, x, m.top, m.top + plotH, spec.format, labelTickCount(x, W - m.left - m.right), W - 1);
      root.appendChild(grid);
      var zero = crisp(x(clamp(0, x.domain[0], x.domain[1])));
      root.appendChild(svg("line", { class: "tv-axisline", x1: zero, x2: zero, y1: m.top, y2: m.top + plotH }));

      var extremeIndex = -1;
      rows.forEach(function (r, i) {
        if (isNum(r.value) && (extremeIndex < 0 || Math.abs(r.value) > Math.abs(rows[extremeIndex].value))) {
          extremeIndex = i;
        }
      });

      var marks = svg("g");
      var valueLayer = svg("g", { class: "tv-values" });
      rows.forEach(function (r, i) {
        var cy = y.step() * i + m.top + y.step() / 2;
        textBlock(marks, labels.wrapped[i].lines, labels.width + 2, cy, { class: "tv-label", "text-anchor": "end" });
        var fill = color(r.role || "model");
        var parts = [];
        var interval = isNum(r.lo) && isNum(r.hi);
        if (isNum(r.value)) {
          var d = barPath("h", x(clamp(0, x.domain[0], x.domain[1])), x(r.value), cy - thick / 2, thick);
          if (d) parts.push(svg("path", { class: "tv-mark", d: d, style: { fill: fill } }));
        }
        if (interval) {
          parts = parts.concat(whisker(x(r.lo), x(r.hi), cy, Math.max(3, thick / 2 - 4), "var(--ink-1)"));
        }
        var g = markGroup(
          marks,
          { x: 0, y: m.top + y.step() * i, width: W, height: y.step() },
          parts,
          r.label + ": " + format(spec.format, r.value) + (interval ? ", " + format(spec.format, r.lo) + " to " + format(spec.format, r.hi) : "")
        );
        if (isNum(r.value) && (mode === "all" || (mode === "extreme" && i === extremeIndex))) {
          var right = r.value >= 0;
          var tip = right ? Math.max(x(r.value), interval ? x(r.hi) : -Infinity) : Math.min(x(r.value), interval ? x(r.lo) : Infinity);
          valueLayer.appendChild(
            svg(
              "text",
              { class: "tv-value", x: tip + (right ? 6 : -6), y: cy, dy: "0.35em", "text-anchor": right ? "start" : "end" },
              format(spec.format, r.value)
            )
          );
        }
        tooltip.attach(g, function () {
          var out = [{ label: valueName, value: format(spec.format, r.value), color: r.role || "model", shape: "rect" }];
          if (interval) {
            out.push({ label: spec.intervalLabel || "Interval", value: format(spec.format, r.lo) + " to " + format(spec.format, r.hi) });
          }
          (spec.reference || []).forEach(function (ref) {
            if (ref && isNum(ref.value)) out.push(refTipRow(ref, spec.format));
          });
          if (r.note) out.push({ label: r.note, value: "" });
          return { title: r.label, rows: out.concat(tipRows(r.tip)) };
        });
      });
      root.appendChild(marks);
      var refs2 = svg("g");
      verticalRefs(refs2, spec, x, m.top, m.top + plotH, false);
      root.appendChild(refs2);
      root.appendChild(valueLayer);
      wrap.appendChild(root);
    });
  }

  /* column ---------------------------------------------------------------- */

  function column(body, spec) {
    spec = spec || {};
    var rows = (spec.rows || []).filter(Boolean);
    var valueName = spec.valueLabel || "Value";
    tableFor(
      body,
      {
        columns: [
          { key: "label", label: spec.labelHeader || "Label" },
          { key: "value", label: valueName, align: "right", format: spec.format },
        ],
        rows: rows,
      },
      spec
    );
    if (!rows.length) return empty(body);
    if (spec.diverging) {
      if (Array.isArray(spec.legend)) roleLegend(body, spec, [], "rect");
    } else {
      roleLegend(
        body,
        spec,
        distinct(
          rows.map(function (r) {
            return r.role || "model";
          })
        ),
        "rect"
      );
    }

    frame(body, "column", function (wrap, W) {
      var values = finite(
        rows.map(function (r) {
          return r.value;
        })
      );
      var refs = referenceValues(spec);
      var dom = spec.domain || [];
      var lo = isNum(dom[0]) ? dom[0] : Math.min.apply(null, [0].concat(values, refs));
      var hi = isNum(dom[1]) ? dom[1] : Math.max.apply(null, [0].concat(values, refs));
      var H = spec.height || 260;
      var top = 20;
      var bottom = 30;
      var y = linear([lo, hi], [H - bottom, top], { nice: !spec.domain });
      var left = yTickWidth(y, spec.format, 5) + 14;
      var zeroV = clamp(0, y.domain[0], y.domain[1]);
      var base = y(zeroV);

      var maxI = -1;
      var minI = -1;
      rows.forEach(function (r, i) {
        if (!isNum(r.value)) return;
        if (maxI < 0 || r.value > rows[maxI].value) maxI = i;
        if (minI < 0 || r.value < rows[minI].value) minI = i;
      });
      var mode = spec.labels || "extreme";
      /* A row may name itself, as a dot chart's rows do, so a title that quotes two bars can label those two. */
      var flagged = rows.some(function (r) {
        return typeof r.labelled === "boolean";
      });
      function labelled(i) {
        if (mode !== "all" && flagged) return rows[i].labelled === true;
        return mode === "all" || (mode === "extreme" && (i === maxI || (i === minI && rows[minI].value < 0)));
      }

      function geometry(extraRight) {
        var right = 8 + extraRight;
        var x = band(
          rows.map(function (_, i) {
            return i;
          }),
          [left, W - right],
          { padding: 0.25 }
        );
        var thick = Math.min(BAR_MAX, x.bandwidth(), Math.max(1, x.step() - GAP));
        var items = rows.map(function (r, i) {
          var cx = x.step() * i + left + x.step() / 2;
          var item = { cx: cx, bar: null, value: null };
          if (isNum(r.value)) {
            var yv = y(r.value);
            item.bar = { x: cx - thick / 2, y: Math.min(yv, base), w: thick, h: Math.abs(base - yv) };
            if (labelled(i)) {
              var up = r.value >= 0;
              var text = format(spec.format, r.value);
              var ty = yv + (up ? -6 : 14);
              item.value = { text: text, y: ty, box: labelBox(cx, ty, measure(text, 11, 500), "middle") };
            }
          }
          return item;
        });
        return { right: right, x: x, thick: thick, items: items };
      }

      var geo = null;
      var placed = null;
      var extra = 0;
      var forced = {};
      for (var pass = 0; pass < 3; pass++) {
        geo = geometry(extra);
        var obstacles = [];
        geo.items.forEach(function (it) {
          if (it.bar) obstacles.push({ rect: it.bar });
          if (it.value) obstacles.push({ rect: it.value.box });
        });
        placed = placeHorizontalRefs(spec, y, left, W - geo.right, top, H - bottom, obstacles, forced);
        if (placed.outside <= extra) break;
        extra = placed.outside;
        placed.list.forEach(function (p, i) {
          if (p.outside) forced[i] = true;
        });
      }

      var x = geo.x;
      var thick = geo.thick;
      var plotRight = W - geo.right;
      var root = chartSvg(W, H, spec, "Column");
      var grid = svg("g");
      yAxisTicks(grid, y, left, plotRight, spec.format, 5);
      root.appendChild(grid);

      var shown = thinLabels(
        rows.map(function (r, i) {
          return { center: geo.items[i].cx, width: measure(r.label, 11) };
        }),
        8
      );

      var marks = svg("g");
      var valueLayer = svg("g", { class: "tv-values" });
      rows.forEach(function (r, i) {
        var cx = geo.items[i].cx;
        var fill = spec.diverging ? color(r.value >= 0 ? "pos" : "neg") : color(r.role || "model");
        var parts = [];
        if (isNum(r.value)) {
          var d = barPath("v", base, y(r.value), cx - thick / 2, thick);
          if (d) parts.push(svg("path", { class: "tv-mark", d: d, style: { fill: fill } }));
        }
        var g = markGroup(
          marks,
          { x: left + x.step() * i, y: top, width: x.step(), height: H - top - bottom },
          parts,
          r.label + ": " + format(spec.format, r.value)
        );
        var v = geo.items[i].value;
        if (v) {
          valueLayer.appendChild(svg("text", { class: "tv-value", x: cx, y: v.y, "text-anchor": "middle" }, v.text));
        }
        if (shown.indexOf(i) >= 0) {
          /*
         * Centred on its own column, always. A line chart clamps its end ticks
         * because its x is continuous and the last tick is the axis end; a
         * category tick names one bar, and anchoring it at the edge would slide
         * it a whole column left of the bar it names.
         */
        marks.appendChild(svg("text", { class: "tv-tick", x: cx, y: H - bottom + 16, "text-anchor": "middle" }, r.label));
        }
        tooltip.attach(g, function () {
          return {
            title: r.label,
            rows: [{ label: valueName, value: format(spec.format, r.value), color: fill, shape: "rect" }].concat(tipRows(r.tip)),
          };
        });
      });
      root.appendChild(svg("line", { class: "tv-axisline", x1: left, x2: plotRight, y1: crisp(base), y2: crisp(base) }));
      root.appendChild(marks);
      var refLayer = svg("g");
      drawHorizontalRefs(refLayer, placed, left, plotRight);
      root.appendChild(refLayer);
      root.appendChild(valueLayer);
      wrap.appendChild(root);
    });
  }

  /* dot: a dot plot, or a dumbbell when there are two series --------------- */

  /* Points closer than a marker along x, in runs: items carry px. */
  function clusters(points) {
    var sorted = points.slice().sort(function (a, b) {
      return a.px - b.px;
    });
    var out = [];
    var current = [];
    sorted.forEach(function (p) {
      if (current.length && p.px - current[current.length - 1].px >= 9) {
        out.push(current);
        current = [];
      }
      current.push(p);
    });
    if (current.length) out.push(current);
    return out;
  }

  /* The most points one row has to draw apart, from their x positions. */
  function clusterSize(pxs) {
    return maxOf(
      clusters(
        pxs.map(function (px) {
          return { px: px };
        })
      ).map(function (c) {
        return c.length;
      }),
      1
    );
  }

  /* Points in one row closer than a marker are moved apart across the row. */
  function dodge(points, rowH) {
    clusters(points).forEach(function (cluster) {
      if (cluster.length < 2) return;
      /* Centres at least a marker apart, and a gap left to the next row's markers. */
      var step = cluster.length === 2 ? 10 : clamp((rowH - 14) / (cluster.length - 1), 8, 10);
      cluster
        .sort(function (a, b) {
          return a.k - b.k;
        })
        .forEach(function (p, j) {
          p.dy = (j - (cluster.length - 1) / 2) * step;
        });
    });
  }

  function dot(body, spec) {
    spec = spec || {};
    var rows = (spec.rows || []).filter(Boolean);
    var series = (spec.series || [{ key: "value", name: spec.valueLabel || "Value", role: "model" }]).slice(0, 3);
    var two = series.length === 2;
    var gapFormat = spec.gapFormat || "signed:" + (spec.gapDp || 2);
    var valueFormat = spec.tableFormat || spec.format;

    function valueOf(r, s) {
      return r.values ? r.values[s.key] : null;
    }
    function intervalOf(r, s, k) {
      var iv = r.intervals && r.intervals[s.key];
      if (iv && isNum(iv.lo) && isNum(iv.hi)) return iv;
      if (k === 0 && isNum(r.lo) && isNum(r.hi)) return { lo: r.lo, hi: r.hi };
      return null;
    }
    /* A row's gap is the collector's when it gives one, otherwise first less second. */
    function gapOf(r) {
      if (!two) return null;
      if (isNum(r.gap)) return r.gap;
      var a = valueOf(r, series[0]);
      var b = valueOf(r, series[1]);
      return isNum(a) && isNum(b) ? a - b : null;
    }
    var hasGroups = rows.some(function (r) {
      return !isNil(r.group) && r.group !== "";
    });
    var hasAside = rows.some(function (r) {
      return !isNil(r.aside) && r.aside !== "";
    });

    var columns = [{ key: "label", label: spec.labelHeader || "Label" }];
    if (hasGroups) columns.push({ key: "group", label: spec.groupHeader || "Group" });
    series.forEach(function (s, k) {
      columns.push({ key: "s:" + s.key, label: s.name, align: "right", format: valueFormat });
      if (
        rows.some(function (r) {
          return intervalOf(r, s, k);
        })
      ) {
        columns.push({ key: "lo:" + s.key, label: s.name + ", low", align: "right", format: valueFormat });
        columns.push({ key: "hi:" + s.key, label: s.name + ", high", align: "right", format: valueFormat });
      }
    });
    if (two) columns.push({ key: "gap", label: spec.gapLabel || "Difference", align: "right", format: gapFormat });
    if (hasAside) columns.push({ key: "aside", label: spec.asideHeader || "Note" });
    tableFor(
      body,
      {
        columns: columns,
        rows: rows.map(function (r) {
          var out = { label: r.label, group: r.group, gap: gapOf(r), aside: r.aside };
          series.forEach(function (s, k) {
            out["s:" + s.key] = valueOf(r, s);
            var iv = intervalOf(r, s, k);
            out["lo:" + s.key] = iv ? iv.lo : null;
            out["hi:" + s.key] = iv ? iv.hi : null;
          });
          return out;
        }),
      },
      spec
    );
    if (!rows.length) return empty(body);
    var legendItems = series.length > 1
      ? series.map(function (s) {
          return { label: s.name, color: s.role, shape: "dot" };
        })
      : [];
    if (
      spec.hollowLegend &&
      rows.some(function (r) {
        return r.hollow;
      })
    ) {
      if (!legendItems.length) legendItems = [{ label: series[0].name, color: series[0].role, shape: "dot" }];
      legendItems.push({ label: spec.hollowLegend, color: "--ink-3", shape: "ring" });
    }
    chartLegend(body, spec, legendItems, "dot");

    /* Which rows carry a label, and what the label says. */
    function labelPlan() {
      var cfg = spec.labels;
      if (cfg === "none" || cfg === false) return null;
      var anyText = rows.some(function (r) {
        return typeof r.text === "string" && r.text;
      });
      if (isNil(cfg) && anyText) return null;
      if (typeof cfg === "string" || isNil(cfg)) cfg = { rows: cfg === "all" ? "all" : "auto" };
      var sIndex = 0;
      series.forEach(function (s, k) {
        if (s.key === cfg.series) sIndex = k;
      });
      var text = cfg.text === "gap" && two ? "gap" : "value";
      function score(r) {
        return text === "gap" || (two && cfg.series === undefined) ? gapOf(r) : valueOf(r, series[sIndex]);
      }
      var picked = {};
      var flagged = rows.some(function (r) {
        return typeof r.labelled === "boolean";
      });
      if (Array.isArray(cfg.rows)) {
        cfg.rows.forEach(function (i) {
          if (isNum(i)) picked[i] = true;
        });
      } else if (cfg.rows === "all") {
        rows.forEach(function (_, i) {
