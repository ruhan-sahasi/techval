# Run the whole suite on every push to main and every pull request.
#
# Nothing in the suite touches the network for data: SEC payloads, prices and
# model panels are committed fixtures. Node runs the asset parse checks and
# the kit's behaviour tests; the runner's Chrome runs the gallery's drawn
# checks. Both Python versions pyproject.toml promises are tested.

name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q -p no:cacheprovider
