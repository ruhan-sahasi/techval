# techval assumptions
#
# Every judgment that moves the valuation is in this file. Nothing in the engine
# carries a hardcoded rate, growth path, margin or multiple, so this file plus a
# set of cached filings fully determines the output.
#
# The values below are a worked example for Datadog (DDOG) as of September 2026.
# They are illustrative, not a recommendation. Read docs/methodology.md before
# changing anything: several of these settings are paired, and the engine will
# refuse combinations that are internally inconsistent rather than quietly
# producing a number that mixes conventions.

ticker: DDOG

price_source: nasdaq        # nasdaq | csv
# price_csv_dir: tests/fixtures/prices   # required when price_source is csv

market:
  # Forward equity risk premium over the 10Y Treasury. This is the single
  # largest unobservable in the model. Practitioners cluster in 4.5% to 6.0%;
  # Damodaran's implied ERP and the Kroll recommended rate both sit in that band.
  equity_risk_premium: 0.050

  # Leave null to pull the latest 10Y constant-maturity yield from the US
  # Treasury daily curve. Set a number to pin the run to a fixed date.
  risk_free_rate: null

  market_index: SPY         # beta regression benchmark
  beta_lookback_years: 2.0
  beta_frequency: weekly    # weekly | monthly
  beta_adjustment: raw      # raw | blume (0.67*raw + 0.33*1.0)
  # How the peers' asset betas are pooled.
  # median   the sell-side default; a beta measured on an R-squared of 0.05
  #          counts exactly as much as one measured on 0.40
  # vasicek  shrink each toward the cross-sectional mean by its own standard
  #          error first, so the noisy ones count for less
  peer_beta_method: median
  size_premium: 0.0

tax:
  # Marginal, not effective. 21% federal plus a blended state burden. The GAAP
  # effective rate of a company carrying NOLs or large SBC windfalls describes
  # discrete items, not the burden on an incremental dollar of operating profit.
  marginal_tax_rate: 0.24
  use_effective_rate: false

leases:
  # false: operating lease liabilities stay out of debt, and every multiple is
  #        quoted on EBITDA, which under ASC 842 is already after rent.
  # true:  liabilities count as debt, and every multiple switches to EBITDAR.
  # The engine will not let you mix the two. See methodology.md.
  capitalize_operating_leases: false
  include_finance_leases_in_debt: true

convertibles:
  # This applies to the TARGET only. A conversion price comes from one company's
  # indenture and means nothing for anybody else, so peers in the comp set are
  # priced with treatment 'auto' and no conversion price: their notes go into
  # debt and the bridge says so. Run a peer as the target to price its own notes.
  #
  # ASU 2020-06 makes if-converted mandatory, so an in-the-money convertible's
  # shares are already inside diluted WASO. Counting the principal as debt as
  # well double-counts the instrument.
  #   auto          decide from conversion_price when supplied
  #   if_converted  exclude from debt (shares already in diluted WASO)
  #   debt          include principal in debt
  treatment: auto
  # Datadog's 2029 notes convert at roughly $148.15. With the stock well above
  # that, the notes are in the money and belong in equity, not debt.
  conversion_price: 148.15

cost_of_debt:
  # filings   interest expense / period-end debt. A book yield. For a zero-coupon
  #           convertible issuer it returns something near zero, which is why it
  #           is not the default. The engine rejects a result below the
  #           risk-free rate and falls back to synthetic.
  # synthetic interest coverage -> implied rating -> spread over the risk-free rate.
  # override  use override_rate below.
  method: synthetic
  override_rate: null

dcf:
  projection_years: 5

  # Revenue growth fades linearly from start to terminal across the horizon.
  revenue_growth_start: 0.22
  revenue_growth_terminal: 0.08

  # EBIT margin path. Null start anchors on the realised TTM margin, which for
  # Datadog is under one percent on a GAAP basis because stock compensation runs
  # above twenty percent of revenue. The terminal margin is therefore the single
  # most consequential assumption in this file.
  ebit_margin_start: null
  ebit_margin_terminal: 0.22

  capex_pct_revenue: 0.030
  da_pct_revenue: 0.020
  # true sets growth, the terminal margin, capex, D&A and working capital from
  # the company's own filings instead of the figures above: the company as it
  # stands, as a baseline for one these figures were not written for. Every
  # command that values a company names each figure it took from the record.
  from_record: false

  # Negative for subscription software: customers are billed ahead of delivery,
  # so deferred revenue grows with the business and growth releases cash. Current
  # debt and leases are left out. Datadog's own balance sheet carries about
  # -20%; the DCF notes print the reported figure beside this one.
  nwc_pct_revenue: -0.06

  # expense  leave SBC inside EBIT, charged against free cash flow (default)
  # addback  restore it as a non-cash charge
  # GAAP EBIT is already net of SBC, so 'expense' adds nothing back. See
  # methodology.md for why adding it back without modelling dilution overstates value.
  sbc_treatment: expense
  # Only bites under addback: grow the share count each year by the stock
  # compensation issued at the share price, the cost that goes with adding the
  # cash back. It closes only about an eighth of the gap between the two
  # camps, because the addback lands mostly in the terminal value; the DCF
  # checks say how much.
  sbc_dilution: true

  mid_year_convention: true
  terminal_growth: 0.025

  # Null uses the peer median EV/EBITDA.
  exit_multiple: null
  wacc_override: null

  sensitivity_wacc_step: 0.015
  sensitivity_growth_step: 0.010

  nol:
    # Off keeps the base case simple. On, a projected loss builds a carryforward
    # that shelters later taxable income. Whatever is left unused at year N is
    # valued on its own and added beside the terminal value, which is taxed at
    # the full rate. Null reads the opening federal balance from the filings.
    track: false
    opening_balance: null
    # Post-2017 federal losses offset at most 80% of a year's taxable income.
    annual_limitation_pct: 0.80
    # After an ownership change the balance at the change is used no faster than
    # this many USD millions a year: the equity value just before the change
    # times the IRS long-term tax-exempt rate. Any unused cap carries forward,
    # and later losses are not capped. Null means no change; a deal case needs it.
    section_382_limit: null

  terminal:
    # Which terminal value is the headline; both are always reported.
    # gordon        capitalise year N's cash flow and check the return it implies
    # value_driver  state the return on new capital and derive the reinvestment
    #               growth needs from it, so the terminal value cannot embed a
    #               return nobody signed up for
    method: gordon
    # The value-driver return in perpetuity. Null uses the WACC, the competitive
    # equilibrium in which growth is worth exactly nothing.
    terminal_roic: null

comps:
  peers: [MDB, NET, ZS, CRWD, SNOW, HUBS]

  # Above this, EV/EBITDA and EV/EBIT are shown as NM. A 900x multiple on a two
  # percent GAAP EBITDA margin is arithmetic, not valuation: it measures how near
  # the denominator sits to zero. Expect most of a GAAP software comp set to be
  # NM on these; the revenue and gross profit multiples are what survive.
  ev_ebitda_nm_threshold: 100.0

  # Lower, because net income sits below interest, tax and every non-operating
  # item, so it reaches zero sooner than an operating line does.
  pe_nm_threshold: 75.0

  apply_percentiles: [0.25, 0.75]

  # Warranted EV/Revenue: an OLS fit across the peers on the drivers below, read
  # off at the company's own growth and margin, with the residual against the
  # traded multiple as the thing to argue about. It declines below
  # min_observations usable peers, and the six names above give five, so on
  # this file it says so rather than fitting three parameters to five points.
  regression:
    enabled: false
    min_observations: 8
    drivers: [revenue_growth, ebitda_margin]

merger:
  # Set exactly one of offer_price_per_share or offer_premium.
  offer_price_per_share: null
  offer_premium: 0.30

  pct_cash: 0.40
  cost_of_new_debt: 0.055
  foregone_cash_yield: 0.040
  balance_sheet_cash_used: 2000.0

  deal_fees: 250.0          # one-time, excluded from run-rate EPS
  financing_fees: 90.0
  financing_fee_amort_years: 7

  # Purchase-accounting step-up amortisation is off by default: it is a non-cash
  # artefact of the transaction and the street quotes cash EPS.
  include_intangible_amortization: false
  intangible_step_up: 0.0
  intangible_life_years: 10

  synergies:
    pretax_cost_synergies: 400.0
    pretax_revenue_synergies: 0.0
    phase_in_year_one: 0.60
    # One-time pre-tax cost of reaching them, USD millions in total, spread
    # evenly from year one. The purchase accounting roll-forward charges it as an
    # operating expense; the year-one screen quotes run-rate EPS and leaves it out.
    cost_to_achieve: 0.0
    cost_to_achieve_years: 2

  # The opening balance sheet a merger model builds. Off, the module stays the
  # year-one screen it is documented as. On, it books goodwill, writes up
  # intangibles with the deferred tax on the step-up, haircuts the target's
  # deferred revenue to fair value, and runs the deal forward with the
  # acquisition debt paid down from free cash flow.
  purchase_accounting:
    enabled: false
    # Share of the price above book equity that goes to identifiable
    # intangibles. Software deals commonly land at 30% to 50%; the rest is
    # goodwill, which is not amortised. The life is this block's own, not the
    # screen's intangible_life_years above.
    intangible_pct_of_excess: 0.40
    intangible_life_years: 7
    # Acquired deferred revenue is written down to the cost of delivering it
    # plus a margin, and the revenue it would have recognised is gone for good.
    deferred_revenue_haircut: 0.40
    projection_years: 3
    debt_repayment_pct_of_fcf: 0.50   # free cash flow swept to the new debt
    # Federal NOL carryforwards at close, USD millions, from the tax footnotes,
    # which shelter the sweep's cash taxes. The acquirer's is uncapped. The deal
    # is the target's ownership change, so section 382 caps its use each year at
    # the equity purchase price times the IRS long-term tax-exempt rate, which has
    # to be set with it, and the target's is booked at close as a deferred tax
    # asset that takes goodwill down. Null carries none.
    acquirer_carryforward: null
    target_carryforward: null
    long_term_tax_exempt_rate: null

# The share count equity value is divided by.
# waso            trailing diluted weighted-average shares as filed. An average
#                 over the past year, so it sits below today's count at a
#                 company issuing steadily.
# treasury_stock  shares outstanding plus the net new shares in-the-money awards
#                 would create at today's price, read from the latest instance
#                 document. Where the awards are not tagged usably it falls back
#                 to waso and says what was missing.
dilution:
  method: waso
  # These two apply under treasury_stock. Unvested RSUs have no strike, so each
  # adds a full share, and leaving them out understates dilution.
  include_rsus: true
  # Zero, as ASC 260 has it: the treasury stock method does not haircut for
  # forfeitures, and guessing a rate is a thumb on the scale.
  assumed_forfeiture_rate: 0.0

# Point in time. Value the company as it was knowable on this date: every fact
# filed after it is discarded and the price series stops there, which is what
# separates a backtest from an exercise in hindsight. Left out, the run uses
# everything on file today.
#
# Both forms below are accepted. YAML resolves an unquoted ISO date to a native
# date object rather than to text, and the engine normalises it back to the ISO
# string it passes to the EDGAR client, so the obvious spelling works and the
# quoted one is not a trap either.
#
# as_of: 2025-12-31
# as_of: "2025-12-31"

# Sector conventions. TMT is three businesses, not one, and the first two
# switches below are on by default because reading a filing's own operating
# metrics costs nothing and changes no valuation number.
tmt:
  # Null classifies from the filer's SIC code and business description. Set it
  # where the classification is wrong, which for a conglomerate it usually is.
  sub_vertical: null
  kpi_extraction: true
  segments: true

  # Value each reported segment on its own peer multiple and sum. Off by
  # default: it is the right answer only where the segments are genuinely
  # separable and separately disclosed, and it needs a plan naming a multiple
  # and a source for each one. `techval sotp TICKER --emit-plan plan.yaml`
  # writes the skeleton. There is no default multiple anywhere in this package.
  sotp: false

# The fitted models. Seven switches, every one false, and that is the contract
# rather than a preference: a discounted cash flow and a comp table trace to
# filings, and a fitted number traces to a recorded panel, a training window and
# a seed. With all seven off the report is byte-identical to what it was before
# any of this existed, which tests/test_cli_integration.py asserts on the
# rendered characters.
#
# Each section reads a recorded artifact. `techval value TICKER --ml-data
# tests/fixtures` points a whole run at the committed set; without the flag the
# sections read ml.cache_dir, which starts empty, and say which file they wanted.
ml:
  random_seed: 7
  # Null uses ~/.techval/ml.
  cache_dir: null
  walk_forward_folds: 5

  peers:
    # Rank a candidate universe by similarity and propose a comp set beside the
    # hand-written one. It proposes, it does not substitute: both lists print
    # and the interesting output is the names one has and the other does not.
    enabled: false
    n_peers: 8
    text_weight: 0.5
    min_market_cap: 1000.0
    max_size_ratio: 10.0

  forecast:
    # Fit the revenue growth fade curve on filings and value the company on it
    # beside the straight line in dcf.revenue_growth_start. This is the switch
    # that replaces the DCF's most consequential typed-in assumption with a
    # measured one, so it prints four valuations rather than one: the assumed
    # path, the fitted path, and the two ends of the band the fit supports.
    enabled: false
    horizon_years: 3
    model: ridge          # ridge | gradient_boosting | linear
    min_train_observations: 60

  warranted:
    # Regress the multiple on fundamentals across the universe and read the
    # residual. A statement about relative pricing and never about value.
    enabled: false
    target: ev_revenue    # ev_revenue | ev_gross_profit | ev_ebitda
    demean_by_date: true
    min_train_observations: 150

  signals:
    # Test whether the residual above has predicted anything. The honest answer
    # is allowed to be no, and on the committed panel it is.
    enabled: false
    horizon_months: 12
    buckets: 5
    min_names_per_date: 20

  mna:
    propensity_enabled: false
    precedents_enabled: false
    lookback_years: 10
    min_deal_size: 250.0

# Monte Carlo over revenue growth, the terminal margin, the discount rate and
# terminal growth, drawn jointly. On, the value report adds the distribution of
# value per share and a tornado beside the DCF.
simulation:
  enabled: false
  draws: 10000
  seed: 7
  revenue_growth_sd: 0.04
  terminal_margin_sd: 0.04
  wacc_sd: 0.010
  terminal_growth_sd: 0.005
  # year_one  shock year-one growth and let the fade pull every draw back to
  #           the same year-N rate
  # path      shift every explicit year by the same draw, the wider spread
  growth_shock: year_one

# Adjusted present value: the business valued unlevered, plus the present value
# of the interest tax shield, reconciled to the WACC answer. The two agree only
# when leverage is constant, and where they part the gap is the finding.
apv:
  enabled: false
  # What the shield is worth turns on how safe it is.
  # cost_of_debt              a fixed debt schedule (Modigliani-Miller)
  # unlevered_cost_of_equity  debt rebalanced continuously with firm value
  #                           (Harris-Pringle), as a constant WACC already implies
  shield_discount_rate: cost_of_debt

scenarios:
  # Bear, base and bull read off the fade panel: the mean growth path of the
  # company-years around each percentile of realised five-year growth, among
  # those that started near this company's growth. Only the growth path moves;
  # everything else stays at the base case. 30/40/30 is Swanson's rule.
  quantiles: {bear: 0.10, base: 0.50, bull: 0.90}
  weights: {bear: 0.30, base: 0.40, bull: 0.30}
  neighbourhood: 0.05
  min_similar: 60
